[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-guard"
version = "0.1.0"
description = "Policy enforcement and guardrails for LangGraph AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "yuvaraj unakal", email = "yuvarajunakal@gmail.com" }
]
keywords = ["langgraph", "ai-agents", "guardrails", "security", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/Yuvarajunakal/langgraph-guard"
Repository = "https://github.com/Yuvarajunakal/langgraph-guard"

[tool.setuptools.packages.find]
where = ["src"]