[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-guardrail"
version = "0.1.1"
description = "Policy enforcement and guardrails for LangGraph AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Yuvaraj Unakal", email = "yuvarajunakal@gmail.com" }
]
keywords = [
    "langgraph",
    "ai-agents",
    "guardrails",
    "security",
    "llm",
    "human-in-the-loop",
    "policy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
langgraph = [
    "langgraph>=0.2.0",
]
dev = [
    "pytest>=7.0",
    "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/Yuvarajunakal/langgraph-guardrail"
Repository = "https://github.com/Yuvarajunakal/langgraph-guardrail"
Issues = "https://github.com/Yuvarajunakal/langgraph-guardrail/issues"
Changelog = "https://github.com/Yuvarajunakal/langgraph-guardrail/blob/main/CHANGELOG.md"


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
langgraph_guard = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]